# The local Solana node of the tests. Container name and ports are the same as in other EthBerry stands: run one at a time.
services:
  solana:
    container_name: solana
    # Agave solana-test-validator (community image; there is no official one). Every start is a new ledger.
    image: beeman/solana-test-validator:4.1.1
    restart: "on-failure"
    security_opt:
      - seccomp=unconfined
    ports:
      - "8899:8899" # JSON-RPC (SOLANA_RPC_URL)
      - "8900:8900" # WebSocket: the tests confirm their transactions through it
